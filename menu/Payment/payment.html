<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thanh Toán</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="payment-container">

    <h1>🍔 ORDER PAYMENT</h1>

    <div class="payment-grid">

      <!-- BILL -->
      <div class="bill-box">
        <h2>🧾 Invoice</h2>
        <div id="bill-list"></div>
        <h3>Total: <span id="bill-total">0</span> VNĐ</h3>
      </div>

      <!-- CUSTOMER INFO -->
      <div class="info-box">
        <h2>📦 Shipping Information</h2>

        <form id="payment-form">
          <input type="text" id="fullName" placeholder="Fullname" readonly />
          <input type="text" id="email" placeholder="Email" readonly />
          <input type="text" id="phone" placeholder="PhoneNumber" required />
          <textarea
            id="address"
            placeholder="Enter Delivery Address"
            required
          ></textarea>

          <select id="payment-method" required>
            <option value="">Select Payment Method</option>
            <option>Cash on Delivery (COD)</option>
            <option>Bank Transfer</option>
            <option>E-Wallet</option>
          </select>

          <button type="submit">💳 Pay Now </button>
        </form>
      </div>

    </div>
  </div>
  <script src="./payment.js"></script>
</body>
</html>
